name: Bot on mention
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  bot:
    # The bot only responds to mentions maintained by Faustze on GitHub
    if: >
      github.actor == 'Faustze' &&
      contains(github.event.comment.body || github.event.issue.body, '@faustze-bot')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # Fine-grained PATs expire (90 days by default), and checkout then
      # fails with a vague "could not read Username"; fail with a clear
      # message instead
      - name: Check BOT_PAT
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ] || ! gh api "repos/$REPO" --silent; then
            echo "::error title=BOT_PAT is missing or expired::Create a fine-grained token (resource owner: ${REPO%/*}, repository: ${REPO#*/}, Contents + Pull requests + Issues: read and write) and save it as the BOT_PAT secret"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.BOT_PAT }}
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: anthropics/claude-code-action@8ce9314fa9a404564fa7e954cd84f25bcba2b829 # v1.0.236
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.BOT_PAT }}
          trigger_phrase: "@faustze-bot"
          branch_prefix: "bot/"
          claude_args: >-
            --model claude-sonnet-5 --max-turns 30
            --allowedTools "Bash(pnpm test:*),Bash(pnpm run test:*),Bash(pnpm lint:*),Bash(pnpm run lint:*),Bash(pnpm typecheck:*),Bash(pnpm run typecheck:*),Bash(pnpm build:*),Bash(pnpm run build:*),Bash(pnpm install:*),Bash(pnpm exec vitest:*)"
