allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  # msw 3 has no install script; pnpm still flags it, so opt out explicitly
  msw: false
onlyBuiltDependencies:
  - "@parcel/watcher"
  - esbuild
# Advisories with no patched release yet. Both packages only run at build
# or dev time inside Nuxt tooling and never ship in the static site.
# Drop an entry once a fixed version is published.
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 (via nitropack): DoS on deeply nested glob patterns;
    # the patterns come from our own build config, not user input
    - GHSA-vfj7-8cjw-p6xm
    # node-forge <=1.4.0 (via @nuxt/cli, nitropack): lax RSA signature
    # verification; only used to make self-signed dev certificates
    - GHSA-86w9-cpqp-85rv
